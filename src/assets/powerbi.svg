<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"
     aria-label="Portada del dashboard en Power BI: indicadores, barras, línea de tendencia y dona">
  <defs>
    <linearGradient id="bi-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="bi-brillo" cx="0.28" cy="0.15" r="0.70">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bi-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#bi-fondo)"/>
  <rect width="1200" height="560" fill="url(#bi-brillo)"/>

  <!-- Tarjetas de indicadores -->
  <g>
    <g fill="#223049" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
      <rect x="80" y="70" width="232" height="104" rx="14"/>
      <rect x="344" y="70" width="232" height="104" rx="14"/>
      <rect x="608" y="70" width="232" height="104" rx="14"/>
      <rect x="872" y="70" width="248" height="104" rx="14"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.18">
      <rect x="108" y="96" width="92" height="9" rx="4.5"/>
      <rect x="372" y="96" width="76" height="9" rx="4.5"/>
      <rect x="636" y="96" width="104" height="9" rx="4.5"/>
      <rect x="900" y="96" width="84" height="9" rx="4.5"/>
    </g>
    <g fill="#818cf8">
      <rect x="108" y="122" width="74" height="22" rx="6"/>
      <rect x="372" y="122" width="56" height="22" rx="6"/>
      <rect x="636" y="122" width="90" height="22" rx="6"/>
      <rect x="900" y="122" width="68" height="22" rx="6" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Barras con linea de tendencia -->
  <g>
    <rect x="80" y="214" width="624" height="272" rx="16"
          fill="#223049" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <rect x="110" y="244" width="128" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>

    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
      <path d="M110 310h564M110 362h564M110 414h564"/>
    </g>

    <g fill="#6366f1">
      <rect x="130" y="368" width="48" height="78" rx="6"/>
      <rect x="208" y="332" width="48" height="114" rx="6"/>
      <rect x="286" y="390" width="48" height="56" rx="6"/>
      <rect x="364" y="296" width="48" height="150" rx="6"/>
      <rect x="442" y="344" width="48" height="102" rx="6"/>
      <rect x="520" y="278" width="48" height="168" rx="6" fill="#818cf8"/>
      <rect x="598" y="320" width="48" height="126" rx="6"/>
    </g>

    <path d="M154 356 L232 322 L310 378 L388 286 L466 332 L544 266 L622 308 L622 446 L154 446 Z"
          fill="url(#bi-area)"/>
    <path d="M154 356 L232 322 L310 378 L388 286 L466 332 L544 266 L622 308"
          fill="none" stroke="#fbbf24" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0b1120" stroke="#fbbf24" stroke-width="3">
      <circle cx="388" cy="286" r="6"/>
      <circle cx="544" cy="266" r="6"/>
    </g>
  </g>

  <!-- Dona -->
  <g>
    <rect x="736" y="214" width="384" height="272" rx="16"
          fill="#223049" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <rect x="766" y="244" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>

    <g transform="translate(866 374)" fill="none" stroke-width="40">
      <circle r="76" stroke="#1b2740"/>
      <!-- circunferencia 2π·76 ≈ 477.5; los tramos suman el total -->
      <circle r="76" stroke="#6366f1" stroke-dasharray="186 292" transform="rotate(-90)"/>
      <circle r="76" stroke="#818cf8" stroke-dasharray="124 354" transform="rotate(50)"/>
      <circle r="76" stroke="#fbbf24" stroke-dasharray="86 392" transform="rotate(144)"/>
      <circle r="76" stroke="#38bdf8" stroke-dasharray="76 402" transform="rotate(209)"/>
    </g>

    <g>
      <g fill="#6366f1"><rect x="1004" y="318" width="11" height="11" rx="3"/></g>
      <g fill="#818cf8"><rect x="1004" y="350" width="11" height="11" rx="3"/></g>
      <g fill="#fbbf24"><rect x="1004" y="382" width="11" height="11" rx="3"/></g>
      <g fill="#38bdf8"><rect x="1004" y="414" width="11" height="11" rx="3"/></g>
      <g fill="#ffffff" fill-opacity="0.18">
        <rect x="1026" y="320" width="62" height="8" rx="4"/>
        <rect x="1026" y="352" width="50" height="8" rx="4"/>
        <rect x="1026" y="384" width="58" height="8" rx="4"/>
        <rect x="1026" y="416" width="44" height="8" rx="4"/>
      </g>
    </g>
  </g>
</svg>
