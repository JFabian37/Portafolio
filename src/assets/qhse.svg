<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"
     aria-label="Portada del Portal QHSE: permisos de trabajo firmados en siete sedes">
  <defs>
    <linearGradient id="qhse-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="qhse-hoja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3850"/>
      <stop offset="100%" stop-color="#1b2740"/>
    </linearGradient>
    <radialGradient id="qhse-brillo" cx="0.70" cy="0.18" r="0.70">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#qhse-fondo)"/>
  <rect width="1200" height="560" fill="url(#qhse-brillo)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 112h1200M0 224h1200M0 336h1200M0 448h1200"/>
    <path d="M150 0v560M300 0v560M450 0v560M600 0v560M750 0v560M900 0v560M1050 0v560"/>
  </g>

  <!-- Las siete sedes, enlazadas -->
  <g>
    <path d="M232 500 L355 470 L478 500 L601 462 L724 492 L847 462 L970 492"
          fill="none" stroke="#6366f1" stroke-opacity="0.45" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0b1120" stroke="#818cf8" stroke-width="3">
      <circle cx="232" cy="500" r="8"/>
      <circle cx="355" cy="470" r="8"/>
      <circle cx="478" cy="500" r="8"/>
      <circle cx="601" cy="462" r="8"/>
      <circle cx="724" cy="492" r="8"/>
      <circle cx="847" cy="462" r="8"/>
      <circle cx="970" cy="492" r="8"/>
    </g>
    <circle cx="601" cy="462" r="17" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- Hoja de permiso detrás -->
  <g transform="rotate(-6 390 230)">
    <rect x="268" y="86" width="250" height="296" rx="14"
          fill="url(#qhse-hoja)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <g fill="#ffffff" fill-opacity="0.10">
      <rect x="300" y="126" width="124" height="12" rx="6"/>
      <rect x="300" y="156" width="188" height="8" rx="4"/>
      <rect x="300" y="178" width="162" height="8" rx="4"/>
      <rect x="300" y="226" width="188" height="8" rx="4"/>
      <rect x="300" y="248" width="140" height="8" rx="4"/>
    </g>
  </g>

  <!-- Hoja de permiso principal -->
  <g>
    <rect x="424" y="62" width="300" height="364" rx="16"
          fill="url(#qhse-hoja)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="424" y="62" width="300" height="56" rx="16" fill="#6366f1" fill-opacity="0.16"/>
    <rect x="456" y="82" width="108" height="14" rx="7" fill="#818cf8" fill-opacity="0.85"/>

    <g fill="#6366f1" fill-opacity="0.18" stroke="#818cf8" stroke-width="2">
      <rect x="456" y="150" width="22" height="22" rx="6"/>
      <rect x="456" y="202" width="22" height="22" rx="6"/>
      <rect x="456" y="254" width="22" height="22" rx="6"/>
    </g>
    <g fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M461 161.5l4 4 7-7.5"/>
      <path d="M461 213.5l4 4 7-7.5"/>
      <path d="M461 265.5l4 4 7-7.5"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.22">
      <rect x="494" y="155" width="190" height="10" rx="5"/>
      <rect x="494" y="207" width="156" height="10" rx="5"/>
      <rect x="494" y="259" width="178" height="10" rx="5"/>
    </g>

    <!-- Firma en pantalla -->
    <path d="M458 364c20-27 31 16 49-5s24-31 44-9 33 5 56-15"
          fill="none" stroke="#818cf8" stroke-width="4"
          stroke-linecap="round" stroke-opacity="0.9"/>
    <rect x="456" y="388" width="236" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.16"/>
  </g>

  <!-- Escudo -->
  <g transform="translate(762 158)">
    <path d="M80 0 L151 27 V87 C151 136 116 169 80 182 C44 169 9 136 9 87 V27 Z"
          fill="#0b1120" stroke="#6366f1" stroke-width="4"/>
    <path d="M80 13 L138 35 V87 C138 128 110 156 80 168 C50 156 22 128 22 87 V35 Z"
          fill="#6366f1" fill-opacity="0.12"/>
    <path d="M53 91l20 20 40-45" fill="none" stroke="#818cf8"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
