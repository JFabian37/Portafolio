<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"
     aria-label="Interfaz del Portal QHSE: formato de permiso de trabajo ATS con firmas y expediente en PDF">
  <defs>
    <linearGradient id="q-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="q-brillo" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="q-sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .t { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .nav  { font-size: 13px; fill: #94a3b8; }
    .navA { font-size: 13px; fill: #ffffff; font-weight: 600; }
    .h    { font-size: 19px; fill: #0f172a; font-weight: 700; }
    .lab  { font-size: 12px; fill: #64748b; }
    .val  { font-size: 13px; fill: #1e293b; font-weight: 600; }
    .chip { font-size: 11px; font-weight: 700; }
    .marca{ font-size: 13px; fill: #ffffff; font-weight: 700; letter-spacing: .4px; }
  </style>

  <rect width="1200" height="560" fill="url(#q-fondo)"/>
  <rect width="1200" height="560" fill="url(#q-brillo)"/>

  <!-- ============ Ventana de la aplicacion ============ -->
  <g filter="url(#q-sombra)">
    <rect x="86" y="54" width="1028" height="474" rx="16" fill="#f1f5f9"/>

    <!-- Barra de titulo -->
    <path d="M86 70a16 16 0 0 1 16-16h996a16 16 0 0 1 16 16v26H86z" fill="#0f172a"/>
    <g>
      <circle cx="112" cy="75" r="5" fill="#475569"/>
      <circle cx="130" cy="75" r="5" fill="#475569"/>
      <circle cx="148" cy="75" r="5" fill="#475569"/>
    </g>
    <rect x="186" y="66" width="340" height="18" rx="9" fill="#1e293b"/>
    <text x="202" y="79" class="t" style="font-size:11px;fill:#64748b">agunsaqhse · Permiso de trabajo</text>

    <!-- ============ Barra lateral ============ -->
    <path d="M86 96h232v416a16 16 0 0 1-16 16H102a16 16 0 0 1-16-16z" fill="#16233c"/>

    <g transform="translate(112 124)">
      <rect width="26" height="26" rx="7" fill="#6366f1"/>
      <path d="M8 13l4 4 7-8" fill="none" stroke="#ffffff" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="18" class="t marca">PORTAL QHSE</text>
    </g>

    <!-- Elemento activo -->
    <rect x="98" y="210" width="208" height="34" rx="8" fill="#6366f1" fill-opacity="0.16"/>
    <rect x="98" y="210" width="3" height="34" rx="1.5" fill="#818cf8"/>

    <g class="t">
      <text x="122" y="188" class="nav">Inicio</text>
      <text x="122" y="232" class="navA">Formato ATS / PETAR</text>
      <text x="122" y="276" class="nav">Registro de terceros</text>
      <text x="122" y="320" class="nav">Panel QHSE</text>
      <text x="122" y="364" class="nav">Inventario y EPP</text>
      <text x="122" y="408" class="nav">SSTV</text>
      <text x="122" y="452" class="nav">Resguardo</text>
    </g>

    <!-- Sedes conectadas, al pie de la barra -->
    <g transform="translate(118 486)">
      <path d="M0 8 L28 2 L56 10 L84 1 L112 8 L140 2 L168 9"
            fill="none" stroke="#6366f1" stroke-opacity="0.55" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#16233c" stroke="#818cf8" stroke-width="2">
        <circle cx="0" cy="8" r="4"/><circle cx="28" cy="2" r="4"/>
        <circle cx="56" cy="10" r="4"/><circle cx="84" cy="1" r="4"/>
        <circle cx="112" cy="8" r="4"/><circle cx="140" cy="2" r="4"/>
        <circle cx="168" cy="9" r="4"/>
      </g>
    </g>

    <!-- ============ Contenido ============ -->
    <text x="352" y="146" class="t h">Permiso de trabajo en altura</text>
    <rect x="352" y="160" width="128" height="4" rx="2" fill="#6366f1"/>

    <!-- Estado -->
    <rect x="948" y="126" width="128" height="28" rx="14" fill="#dcfce7"/>
    <circle cx="968" cy="140" r="4" fill="#16a34a"/>
    <text x="980" y="145" class="t chip" fill="#15803d">FIRMADO</text>

    <!-- Campos del formato -->
    <g>
      <rect x="352" y="188" width="340" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="370" y="211" class="t lab">Tipo de formato</text>
      <text x="370" y="234" class="t val">ATS — Trabajo en altura</text>

      <rect x="708" y="188" width="368" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="726" y="211" class="t lab">Sede</text>
      <text x="726" y="234" class="t val">IMUPESA LLENOS</text>
    </g>

    <!-- Lista de verificacion -->
    <rect x="352" y="266" width="340" height="166" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="370" y="292" class="t lab">Verificaciones</text>
    <g>
      <g fill="#dcfce7"><circle cx="380" cy="316" r="9"/><circle cx="380" cy="350" r="9"/><circle cx="380" cy="384" r="9"/></g>
      <g fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M376 316l3 3 5.5-6"/><path d="M376 350l3 3 5.5-6"/><path d="M376 384l3 3 5.5-6"/>
      </g>
      <g fill="#cbd5e1">
        <rect x="400" y="311" width="214" height="9" rx="4.5"/>
        <rect x="400" y="345" width="178" height="9" rx="4.5"/>
        <rect x="400" y="379" width="236" height="9" rx="4.5"/>
      </g>
      <rect x="370" y="406" width="112" height="9" rx="4.5" fill="#e2e8f0"/>
    </g>

    <!-- Firma en pantalla -->
    <rect x="708" y="266" width="368" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="726" y="292" class="t lab">Firma del trabajador</text>
    <path d="M734 344c6-18 13-28 17-14s-2 26 4 27 11-20 16-34 9 4 6 22 3 16 11 1
             14-32 20-20-3 20 4 21 16-10 26-20 18-14 14-3 4 14 14 10 18-12 24-18"
          fill="none" stroke="#1e293b" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="726" y="354" width="332" height="2" rx="1" fill="#e2e8f0"/>

    <!-- Expediente generado -->
    <rect x="708" y="392" width="368" height="40" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <g transform="translate(726 402)">
      <rect width="16" height="20" rx="3" fill="#6366f1"/>
      <path d="M4 7h8M4 11h8M4 15h5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="754" y="417" class="t val" fill="#4338ca">Expediente.pdf generado y archivado</text>
  </g>
</svg>
